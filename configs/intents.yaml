- intent_id: other_unclear
  name: Other / Ambiguous Inquiries
  description: Fragmented tweets, ambiguous requests lacking context, greetings without
    questions, or requests outside customer support scope.
  inclusion_criteria:
  - One-word or vague messages like 'Help', 'Hello', 'DM sent'
  - Non-support social media mentions or chatter
  - Inquiries lacking sufficient information to classify into primary taxonomy
  exclusion_criteria:
  - Any query with sufficient actionable evidence matching primary domain intents
  default_risk: low
  examples:
  - '[Real Tweet Excerpt]: Hello Don''t send a special edition game like this in just
    a cardboard sleeve. It clearly got crushed b/c bad packaging. https://t.co/zoEmj23Hh5'
  - '[Real Tweet Excerpt]: Hi there, still no response from anyone!'
  - '[Real Tweet Excerpt]: - Hi there, I contacted the store 4 business days ago but
    have not heard back. Is there a help email at amazon? I can''t make a A-Z claim
