version: '3.8'

services:
  agent-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: hiver-agent-api:latest
    container_name: hiver_agent_service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ALLOW_MOCK_EVAL=1
      - TOKENIZERS_PARALLELISM=false
      - LOKY_MAX_CPU_COUNT=1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
