name: CI & Docker Verification Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Test, Containerize & Verify Health
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare CI data and model artifacts
        run: |
          set -eux

          python scripts/prepare_data.py --source real
          python scripts/build_golden_set.py
          python scripts/finalize_golden_set.py
          python scripts/train_baselines.py
          python scripts/build_escalation_calibration.py

          required_files=(
            data/processed/train.csv
            data/processed/validation.csv
            data/processed/test.csv
            data/processed/test_pool.csv
            data/golden/annotation_template.csv
            data/golden/golden_set.csv
            reports/golden_set_profile.md
            models/intent_tfidf_logreg.joblib
            models/rag_faiss.index
            models/rag_metadata.json
          )

          for file in "${required_files[@]}"; do
            test -f "$file" || {
              echo "::error file=$file::Required CI artifact is missing"
              exit 1
            }
          done

      - name: Verify source package
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          root = Path.cwd()
          print("Working directory:", root)
          print("src/models exists:", (root / "src/models").exists())
          print("src/models/agent.py exists:", (root / "src/models/agent.py").exists())

          import src.models
          from src.models.agent import TwitterSupportAgent

          print("src.models import: OK")
          print("TwitterSupportAgent import: OK")
          PY

      - name: Run Pytest suite
        env:
          PYTHONPATH: ${{ github.workspace }}
          TOKENIZERS_PARALLELISM: "false"
          LOKY_MAX_CPU_COUNT: "1"
          OMP_NUM_THREADS: "1"
          KMP_DUPLICATE_LIB_OK: "TRUE"
        run: |
          python -m pytest tests/

      - name: Build Docker image
        run: |
          docker build -t hiver-agent:latest .

      - name: Run Docker container
        run: |
          docker run -d --name agent-container -p 8000:8000 hiver-agent:latest
          sleep 5

      - name: Verify Container Health Endpoint
        run: |
          curl --fail http://localhost:8000/api/v1/health || (docker logs agent-container && exit 1)

      - name: Stop and cleanup container
        if: always()
        run: |
          docker stop agent-container || true
          docker rm agent-container || true
